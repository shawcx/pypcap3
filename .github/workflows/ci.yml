name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install libpcap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test -e .
      # the suite needs no root or network; it reads and writes capture files
      - name: Test
        run: python -m pytest -v

  # the type stubs against the compiled module, and the types they give
  typing:
    name: typing (ubuntu-latest, Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      # a regular install, so mypy finds the pypcap3-stubs package in site-packages
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group typing .
      - name: stubtest
        run: python -m mypy.stubtest pypcap3 --allowlist stubtest-allowlist.txt
      - name: mypy
        run: python -m mypy --strict test/typing_check.py

  # Windows only builds: running the tests needs the Npcap driver, whose free
  # installer can't run unattended
  build-windows:
    name: build (windows-latest, Python 3.14)
    runs-on: windows-latest
    env:
      NPCAP_SDK_VERSION: '1.16'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Download the Npcap SDK
        shell: pwsh
        run: |
          Invoke-WebRequest "https://npcap.com/dist/npcap-sdk-$env:NPCAP_SDK_VERSION.zip" -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath "$env:RUNNER_TEMP\npcap-sdk"
          "NPCAP_SDK=$env:RUNNER_TEMP\npcap-sdk" >> $env:GITHUB_ENV
      - name: Build a wheel
        run: python -m pip wheel --no-deps -w dist .
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: dist/*.whl
